# PodTemplate for DWS ProvisioningRequest
apiVersion: v1
kind: PodTemplate
metadata:
  name: mimo-v25-pro-nfs-dws-template
  namespace: default
template:
  spec:
    restartPolicy: Never
    nodeSelector:
      cloud.google.com/gke-nodepool: jingnw-dws-tpu7-16ch
      cloud.google.com/gke-tpu-accelerator: tpu7x
      cloud.google.com/gke-tpu-topology: 2x2x4
    tolerations:
    - key: google.com/tpu
      operator: Equal
      value: present
      effect: NoSchedule
    containers:
    - name: mimo-v25-pro-nfs-demo
      image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.9.0-rev1
      resources:
        limits:
          cpu: "220"
          memory: 900Gi
          google.com/tpu: "4"
        requests:
          cpu: "220"
          memory: 900Gi
          google.com/tpu: "4"
---
# DWS ProvisioningRequest: 2x2x4 slice for 36 hours
apiVersion: autoscaling.x-k8s.io/v1
kind: ProvisioningRequest
metadata:
  name: mimo-v25-pro-nfs-dws
  namespace: default
spec:
  provisioningClassName: queued-provisioning.gke.io
  parameters:
    maxRunDurationSeconds: "129600"
  podSets:
  - count: 4
    podTemplateRef:
      name: mimo-v25-pro-nfs-dws-template
---
# Headless service for rank-0 pod discovery
apiVersion: v1
kind: Service
metadata:
  name: mimo-v25-pro-nfs-demo
  namespace: default
spec:
  clusterIP: None
  selector:
    job-name: mimo-v25-pro-nfs-demo
  ports:
  - name: dist-init
    port: 6006
  - name: http
    port: 8080
---
# 4-node demo job using NFS weight servers (jingnw-nfs-weights-1/2/3).
# Weight loading strategy: 3x RAM-backed NFS exports (tmpfs on n2-highmem-48 VMs)
#   VM-1 (10.128.0.92):   12 safetensors files (~322 GB)
#   VM-2 (10.128.15.231): 12 safetensors files (~350 GB)
#   VM-3 (10.128.0.45):   10 safetensors files (~292 GB)
#   All 3 mounted and symlinked into /mnt/weights on each pod.
apiVersion: batch/v1
kind: Job
metadata:
  name: mimo-v25-pro-nfs-demo
  namespace: default
spec:
  completions: 4
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 0
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/consume-provisioning-request: mimo-v25-pro-nfs-dws
        cluster-autoscaler.kubernetes.io/provisioning-class-name: queued-provisioning.gke.io
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      restartPolicy: Never
      subdomain: mimo-v25-pro-nfs-demo
      nodeSelector:
        cloud.google.com/gke-nodepool: jingnw-dws-tpu7-16ch
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x4
        cloud.google.com/gke-accelerator-count: "4"
      tolerations:
      - key: google.com/tpu
        operator: Equal
        value: present
        effect: NoSchedule
      containers:
      - name: mimo-v25-pro-nfs-demo
        image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.9.0-rev1
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        command: [bash, -lc]
        args:
        - |
          set -euo pipefail
          export PATH="/opt/venv/bin:${PATH}"
          INDEX=${JOB_COMPLETION_INDEX}
          COORDINATOR="mimo-v25-pro-nfs-demo-0.mimo-v25-pro-nfs-demo.default.svc.cluster.local"
          BUCKET="gs://jingnw-mimo-v2-5-pro-us-central1"
          ts() { echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')]"; }

          echo "=== [rank${INDEX}] Installing sglang-jax ==="
          git clone -b tpu7 https://github.com/geeningwang/sglang-jax.git /workspace
          cd /workspace
          uv pip install -e "python[all]"
          # Upgrade Orbax to 0.12+ for native FP8 array restore support
          uv pip install "orbax-checkpoint>=0.12.0"

          echo "=== [rank${INDEX}] Mounting NFS weight servers ==="
          apt-get update -qq && apt-get install -y -qq nfs-common
          mkdir -p /mnt/nfs1 /mnt/nfs2 /mnt/nfs3 /mnt/weights

          # Mount all 3 NFS servers (nconnect=8 for parallel TCP connections)
          mount -t nfs -o ro,hard,intr,nconnect=8 10.128.0.92:/mnt/weights   /mnt/nfs1
          mount -t nfs -o ro,hard,intr,nconnect=8 10.128.15.231:/mnt/weights /mnt/nfs2
          mount -t nfs -o ro,hard,intr,nconnect=8 10.128.0.45:/mnt/weights   /mnt/nfs3

          # Merge into a unified /mnt/weights via symlinks
          for f in /mnt/nfs1/* /mnt/nfs2/* /mnt/nfs3/*; do
            ln -sf "$f" /mnt/weights/$(basename "$f") 2>/dev/null || true
          done

          SAFETENSORS=$(ls /mnt/weights/*.safetensors | wc -l)
          echo "$(ts) [rank${INDEX}] NFS ready: ${SAFETENSORS} safetensors files at /mnt/weights"

          if [ "${INDEX}" = "0" ]; then
            T_START=$(date +%s)
            echo "$(ts) [rank0] PHASE: launching server  [T=0s]"
            JAX_COMPILATION_CACHE_DIR=${BUCKET}/jax-compilation-cache \
            python3 -m sgl_jax.launch_server \
              --model-path /mnt/weights \
              --trust-remote-code \
              --tp-size 32 \
              --device tpu \
              --dtype bfloat16 \
              --mem-fraction-static 0.85 \
              --page-size 16 \
              --chunked-prefill-size 512 \
              --max-running-requests 2 \
              --host 0.0.0.0 \
              --port 8080 \
              --nnodes 4 \
              --node-rank 0 \
              --dist-init-addr ${COORDINATOR}:6006 &
            SERVER_PID=$!
            echo "$(ts) [rank0] PHASE: waiting for /health (PID=$SERVER_PID)"

            for i in $(seq 1 25920); do
              if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
                T_HEALTHY=$(date +%s)
                echo "$(ts) [rank0] PHASE: server healthy after $((i * 5))s  [total elapsed: $((T_HEALTHY - T_START))s]"
                break
              fi
              if ! kill -0 $SERVER_PID 2>/dev/null; then
                echo "$(ts) [rank0] ERROR: server process died after $((i * 5))s"
                exit 1
              fi
              if [ $((i % 60)) -eq 0 ]; then
                echo "$(ts) [rank0] still waiting for /health ($((i * 5))s elapsed)"
              fi
              sleep 5
            done

            echo ""
            echo "$(ts) [rank0] PHASE: sending demo inference request"
            echo "Input: 'Explain how tensor parallelism works in large language model inference, and what are the tradeoffs compared to pipeline parallelism?'"
            echo ""

            RESPONSE=$(curl -sf --max-time 300 http://localhost:8080/v1/chat/completions \
              -H "Content-Type: application/json" \
              -d '{
                "model": "MiMo-V2.5-Pro",
                "messages": [{"role": "user", "content": "Explain how tensor parallelism works in large language model inference, and what are the tradeoffs compared to pipeline parallelism?"}],
                "max_tokens": 512,
                "temperature": 0.7
              }')
            echo "$(ts) [rank0] PHASE: inference response received"
            echo "Raw response:"
            echo "$RESPONSE"
            echo ""
            echo "Parsed output:"
            echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); u=d['usage']; print(d['choices'][0]['message']['content']); print(); print('[tokens: prompt=%d, completion=%d]' % (u['prompt_tokens'], u['completion_tokens']))"
            echo ""
            echo "=== Demo complete ==="
            kill $SERVER_PID
          else
            echo "$(ts) [rank${INDEX}] PHASE: launching worker server"
            JAX_COMPILATION_CACHE_DIR=${BUCKET}/jax-compilation-cache \
            python3 -m sgl_jax.launch_server \
              --model-path /mnt/weights \
              --trust-remote-code \
              --tp-size 32 \
              --device tpu \
              --dtype bfloat16 \
              --mem-fraction-static 0.85 \
              --page-size 16 \
              --chunked-prefill-size 512 \
              --max-running-requests 2 \
              --host 0.0.0.0 \
              --port 8080 \
              --nnodes 4 \
              --node-rank ${INDEX} \
              --dist-init-addr ${COORDINATOR}:6006
          fi
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: XLA_FLAGS
          value: "--xla_tpu_rematerialization_algo=PEAK_PRIORITY"
        - name: SGLANG_CHECKPOINT_DIR
          value: "gs://jingnw-mimo-v2-5-pro-us-central1/sglang-checkpoint"
        resources:
          limits:
            cpu: "220"
            memory: 900Gi
            google.com/tpu: "4"
          requests:
            cpu: "220"
            memory: 900Gi
            google.com/tpu: "4"
