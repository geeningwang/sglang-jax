apiVersion: batch/v1
kind: Job
metadata:
  name: flex-tpu7-smoke
  namespace: default
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-nodepool: jingnw-flex-tpu7
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x1
        cloud.google.com/gke-accelerator-count: "4"
      tolerations:
      - key: google.com/tpu
        operator: Equal
        value: present
        effect: NoSchedule
      containers:
      - name: smoke
        image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.8.1-rev1
        imagePullPolicy: IfNotPresent
        command: [bash, -lc]
        args:
        - |
          export PATH="/opt/venv/bin:${PATH}"
          python3 -c "
          import jax
          print('JAX version:', jax.__version__)
          print('Device count:', jax.device_count())
          print('Devices:', jax.devices())
          "
        resources:
          limits:
            google.com/tpu: "4"
          requests:
            google.com/tpu: "4"
