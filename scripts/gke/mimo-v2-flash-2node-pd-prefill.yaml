# PD 1P1D — Pod 0: prefill server + bootstrap
# Single-pod job with its own ProvisioningRequest (count=1).
# Gang size for 2x2x1 TPU is 1, so each pod needs a separate PR.
---
apiVersion: v1
kind: PodTemplate
metadata:
  name: mimo-v2-flash-2node-pd-prefill-template
  namespace: default
template:
  spec:
    restartPolicy: Never
    nodeSelector:
      cloud.google.com/gke-nodepool: jingnw-dws-tpu7-4ch
      cloud.google.com/gke-tpu-accelerator: tpu7x
      cloud.google.com/gke-tpu-topology: 2x2x1
    tolerations:
    - key: google.com/tpu
      operator: Equal
      value: present
      effect: NoSchedule
    containers:
    - name: mimo-v2-flash-2node-pd-prefill
      image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.9.0-rev1
      resources:
        requests:
          cpu: "220"
          memory: "900Gi"
          google.com/tpu: "4"
        limits:
          cpu: "220"
          memory: "900Gi"
          google.com/tpu: "4"
---
apiVersion: autoscaling.x-k8s.io/v1
kind: ProvisioningRequest
metadata:
  name: mimo-v2-flash-2node-pd-prefill
  namespace: default
spec:
  provisioningClassName: queued-provisioning.gke.io
  parameters:
    maxRunDurationSeconds: "21600"
  podSets:
  - count: 1
    podTemplateRef:
      name: mimo-v2-flash-2node-pd-prefill-template
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mimo-v2-flash-2node-pd-prefill
  namespace: default
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/consume-provisioning-request: mimo-v2-flash-2node-pd-prefill
        cluster-autoscaler.kubernetes.io/provisioning-class-name: queued-provisioning.gke.io
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-nodepool: jingnw-dws-tpu7-4ch
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x1
      tolerations:
      - key: google.com/tpu
        operator: Equal
        value: present
        effect: NoSchedule
      containers:
      - name: mimo-v2-flash-2node-pd-prefill
        image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.9.0-rev1
        imagePullPolicy: IfNotPresent
        command: ["bash", "-lc"]
        args:
        - |
          set -euo pipefail
          export PATH="/opt/venv/bin:${PATH}"
          RESULTS_BUCKET="gs://jingnw-mimo-v2-flash-us-central1"
          RESULTS_DIR="${RESULTS_BUCKET}/perf-results/flash-2node-pd1p1d"
          NFS_IP_FLAG="${RESULTS_BUCKET}/nfs-flash-2node-ip"
          POD0_IP_FLAG="${RESULTS_BUCKET}/pd1p1d-pod0-ip"
          DONE_FLAG="${RESULTS_BUCKET}/pd1p1d-pod1-done"
          BOOTSTRAP_PORT=8998
          PREFILL_PORT=10000
          ts() { echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')]"; }

          echo "$(ts) === [prefill] Clone geeningwang/sglang-jax branch mimo-tpu7-stage2 ==="
          git clone https://github.com/geeningwang/sglang-jax.git /workspace
          cd /workspace
          git checkout mimo-tpu7-stage2
          echo "$(ts) HEAD: $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s)"
          uv pip install -e "python[all]"
          uv pip install "orbax-checkpoint>=0.12.0"

          apt-get update -qq && apt-get install -y -qq nfs-common
          echo "$(ts) Polling GCS for NFS server IP..."
          NFS_SERVER=""
          for i in $(seq 1 360); do
            if NFS_SERVER=$(gsutil cat "${NFS_IP_FLAG}" 2>/dev/null) && [ -n "${NFS_SERVER}" ]; then
              echo "$(ts) NFS server IP: ${NFS_SERVER}"; break
            fi
            [ $((i % 12)) -eq 0 ] && echo "$(ts) waiting for NFS IP... (${i}×5s)"
            sleep 5
          done
          [ -z "${NFS_SERVER}" ] && { echo "$(ts) ERROR: NFS IP never appeared"; exit 1; }

          MODEL_PATH=/tmp/flash-model
          mkdir -p "${MODEL_PATH}"
          for i in $(seq 1 120); do
            if mount -t nfs -o nfsvers=3,nolock,rsize=1048576,wsize=1048576,hard,intr,timeo=600 \
                "${NFS_SERVER}:/export/flash" "${MODEL_PATH}" 2>/dev/null; then
              echo "$(ts) NFS mounted (attempt ${i})"; break
            fi
            [ $((i % 12)) -eq 0 ] && echo "$(ts) NFS not ready, retrying..."
            sleep 5
          done
          echo "$(ts) Flash weights: $(ls ${MODEL_PATH}/*.safetensors 2>/dev/null | wc -l) files"

          MY_IP=$(curl -sf http://metadata.google.internal/computeMetadata/v1/instance/network-interfaces/0/ip \
                    -H "Metadata-Flavor: Google")
          echo "$(ts) [prefill] IP: ${MY_IP}"

          BLOG="/tmp/bootstrap.log"
          PLOG="/tmp/server_prefill.log"
          echo "$(ts) [prefill] Starting bootstrap server on port ${BOOTSTRAP_PORT}..."
          python3 -m sgl_jax.srt.disaggregation.run_bootstrap \
            --host 0.0.0.0 --port "${BOOTSTRAP_PORT}" >> "${BLOG}" 2>&1 &
          BOOTSTRAP_PID=$!
          for i in $(seq 1 30); do
            if ss -tlnp 2>/dev/null | grep -q ":${BOOTSTRAP_PORT} "; then
              echo "$(ts) [prefill] Bootstrap ready after $((i*2))s"; break
            fi
            sleep 2
          done

          echo "${MY_IP}" | gsutil cp - "${POD0_IP_FLAG}"
          echo "$(ts) [prefill] IP ${MY_IP} written to GCS."

          echo "$(ts) [prefill] Starting prefill server on port ${PREFILL_PORT}..."
          JAX_COMPILATION_CACHE_DIR="${RESULTS_BUCKET}/jax-compilation-cache" \
          python3 -m sgl_jax.launch_server \
            --model-path "${MODEL_PATH}" \
            --trust-remote-code \
            --enable-sequence-parallel \
            --tp-size 8 --dp-size 1 --ep-size 8 \
            --moe-backend fused_v2 \
            --nnodes 1 --node-rank 0 --host 0.0.0.0 \
            --port "${PREFILL_PORT}" \
            --page-size 256 --context-length 262144 \
            --disable-radix-cache \
            --chunked-prefill-size 2048 --max-prefill-tokens 16384 \
            --dtype bfloat16 --mem-fraction-static 0.84 \
            --swa-full-tokens-ratio 0.2 \
            --skip-server-warmup --log-level info \
            --decode-log-interval 1 --max-running-requests 256 \
            --dp-schedule-policy round_robin \
            --precompile-bs-paddings 1 4 8 16 32 64 128 256 \
            --precompile-token-paddings 4096 \
            --disaggregation-mode prefill \
            --disaggregation-bootstrap-url "http://localhost:${BOOTSTRAP_PORT}" \
            >> "${PLOG}" 2>&1 &
          PREFILL_PID=$!

          echo "$(ts) [prefill] Waiting for decode pod done signal..."
          until gsutil ls "${DONE_FLAG}" >/dev/null 2>&1; do sleep 10; done
          echo "$(ts) [prefill] Done. Uploading logs."
          gsutil cp "${BLOG}" "${RESULTS_DIR}/bootstrap.log"      || true
          gsutil cp "${PLOG}" "${RESULTS_DIR}/server-prefill.log" || true
          kill "${PREFILL_PID}" "${BOOTSTRAP_PID}" 2>/dev/null || true
          echo "$(ts) === [prefill] Done ==="
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: LIBTPU_INIT_ARGS
          value: "--xla_tpu_dvfs_p_state=7"
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: "220"
            memory: "900Gi"
            google.com/tpu: "4"
          limits:
            cpu: "220"
            memory: "900Gi"
            google.com/tpu: "4"
