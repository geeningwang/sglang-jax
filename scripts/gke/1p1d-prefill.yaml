# MiMo-V2.5 1P1D PREFILL — v6e-16 (4x4) on GKE, node pool tpu-v6e-slice-0.
#
# Pairs with 1p1d-decode.yaml. Pod 0 additionally runs the bootstrap server that
# decode discovers over headless DNS. See GUIDE_gke_v6e16_1p1d.md.
---
apiVersion: v1
kind: Service
metadata:
  name: mimo-p-svc
  namespace: mimo
spec:
  clusterIP: None
  selector:
    job-name: mimo-p
  ports:
  - name: dist-init
    port: 5000
  - name: tpu-process
    port: 8471
  - name: http
    port: 10000
  - name: bootstrap
    port: 8998
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mimo-p
  namespace: mimo
spec:
  # 0, not the cookbook's 16: a silent retry on a benchmark burns a ~25 min
  # weight load and can leave the decode job waiting on a bootstrap that moved.
  # Fail visibly instead.
  backoffLimit: 0
  completionMode: Indexed
  parallelism: 4
  completions: 4
  template:
    metadata:
      annotations:
        gke-gcsfuse/volumes: "true"
        # CPU/memory unlimited: the sidecar defaults throttle a 293 GiB weight load.
        gke-gcsfuse/cpu-limit: "0"
        gke-gcsfuse/memory-limit: "0"
        # Ephemeral storage is NOT unlimited. Node allocatable is only ~43 GiB
        # against a 293 GiB model; an unbounded sidecar evicts the whole pod.
        gke-gcsfuse/ephemeral-storage-limit: "12Gi"
    spec:
      subdomain: mimo-p-svc
      restartPolicy: Never
      serviceAccountName: mimo-sa
      nodeSelector:
        cloud.google.com/gke-nodepool: tpu-v6e-slice-0
        cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
        cloud.google.com/gke-tpu-topology: 4x4
      containers:
      - name: prefill
        image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.8.1-rev1
        command: ["bash", "-lc"]
        args:
        - |
          set -euxo pipefail
          WID="${JOB_COMPLETION_INDEX}"
          ts() { echo "[$(date -u '+%FT%TZ')] [p-w${WID}]"; }

          BRANCH="${BRANCH:-perf/issue-323-scheduler-overlap}"
          RUN_TAG="${RUN_TAG:-baseline}"
          OUT="/gcs-out/perf-results/gke-v6e16-1p1d/${RUN_TAG}"
          DONE_FLAG="/gcs-out/coord/gke-v6e16-1p1d-done"

          git clone https://github.com/geeningwang/sglang-jax.git /tmp/sglang-jax
          cd /tmp/sglang-jax
          git checkout "${BRANCH}"
          echo "$(ts) HEAD $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s)"
          # [all] pins jax 0.10.2 + libtpu 0.0.42.1 and installs over the
          # image's jax 0.8.1. This is the pairing the v6e-16 1P1D tpu-vm runs
          # were validated on; the image only supplies the base layer.
          # --no-cache-dir: the wheel cache is several GiB of node ephemeral storage
          # that is never read again, and disk here is the binding constraint.
          pip install --no-cache-dir -e "python[all]"
          pip install --no-cache-dir "orbax-checkpoint>=0.12.0" aiohttp

          # Pod 0 owns the bootstrap server that decode dials.
          if [ "${WID}" = "0" ]; then
            python -m sgl_jax.srt.disaggregation.run_bootstrap \
              --host 0.0.0.0 --port 8998 >> /tmp/bootstrap.log 2>&1 &
            for i in $(seq 1 60); do
              curl -sf "http://127.0.0.1:8998/health" >/dev/null 2>&1 && break
              sleep 2
            done
            echo "$(ts) bootstrap up"
          fi

          SLOG="/tmp/server_prefill_w${WID}.log"
          JAX_COMPILATION_CACHE_DIR=/gcs-out/jit-cache/prefill \
          LIBTPU_INIT_ARGS="--xla_tpu_dvfs_p_state=7" \
          PYTHONUNBUFFERED=1 \
          python -m sgl_jax.launch_server \
            --model-path /gcs-model/MiMo-V2.5 \
            --trust-remote-code \
            --enable-sequence-parallel \
            --tp-size 16 --dp-size 1 --ep-size 16 \
            --moe-backend fused_v2 \
            --nnodes 4 --node-rank "${WID}" \
            --dist-init-addr mimo-p-0.mimo-p-svc:5000 \
            --host 0.0.0.0 --port 10000 \
            --page-size 256 \
            --context-length 262144 \
            --disable-radix-cache \
            --chunked-prefill-size 2048 \
            --max-prefill-tokens 16384 \
            --dtype bfloat16 \
            --mem-fraction-static "${MEM_FRACTION_STATIC:-0.75}" \
            --swa-full-tokens-ratio 0.2 \
            --skip-server-warmup \
            --log-level info \
            --decode-log-interval 1 \
            --max-running-requests 256 \
            --dp-schedule-policy round_robin \
            --precompile-bs-paddings 1 4 8 16 32 64 128 256 \
            --precompile-token-paddings 4096 \
            --disaggregation-mode prefill \
            --disaggregation-bootstrap-url "http://mimo-p-0.mimo-p-svc:8998" \
            --enable-request-time-stats-logging \
            >> "${SLOG}" 2>&1 &
          SRV=$!
          echo "$(ts) server launched pid=${SRV}"

          # Hold the slice until decode signals the sweep is finished.
          while true; do
            [ -f "${DONE_FLAG}" ] && { echo "$(ts) done flag seen"; break; }
            kill -0 "${SRV}" 2>/dev/null || { echo "$(ts) SERVER EXITED"; break; }
            sleep 10
          done

          mkdir -p "${OUT}" 2>/dev/null || true
          cp "${SLOG}" "${OUT}/server-prefill-w${WID}.log" || true
          [ "${WID}" = "0" ] && cp /tmp/bootstrap.log "${OUT}/bootstrap.log" || true
          kill "${SRV}" 2>/dev/null || true
          echo "$(ts) complete"
        env:
        - name: JOB_COMPLETION_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['batch.kubernetes.io/job-completion-index']
        - name: TPU_WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['batch.kubernetes.io/job-completion-index']
        - name: TPU_WORKER_HOSTNAMES
          value: "mimo-p-0.mimo-p-svc,mimo-p-1.mimo-p-svc,mimo-p-2.mimo-p-svc,mimo-p-3.mimo-p-svc"
        - name: TPU_PROCESS_ADDRESSES
          value: "mimo-p-0.mimo-p-svc:8471,mimo-p-1.mimo-p-svc:8471,mimo-p-2.mimo-p-svc:8471,mimo-p-3.mimo-p-svc:8471"
        - name: TPU_PROCESS_PORT
          value: "8471"
        - name: BRANCH
          value: "perf/issue-323-scheduler-overlap"
        - name: RUN_TAG
          value: "baseline"
          # 0.75, not decode's 0.84. Prefill hands KV off immediately and never
          # accumulates a pool (observed full-token usage 0.00-0.03), but
          # _extract_req_kv stacks one req's KV across all 48 layers into a single
          # ~768MB transient buffer. At 0.84 only 387MB was free and prefill died with
          # RESOURCE_EXHAUSTED E0100 RuntimeBufferAllocationFailure, taking the mesh
          # (and the decode job) down with it.
          #
          # Sizing, from the 0.84 run's own profile line (available_kv_cache=7.1GB on
          # a 32GiB v6e chip): weights are ~19.8GiB ~= 0.62 of HBM, so anything at or
          # below that has no room left for KV at all -- 0.60 duly failed startup with
          # "Not enough memory. Please try to increase --mem-fraction-static." 0.75
          # leaves a 4.2GB KV pool (prefill peak use was ~0.2GB) and hands 2.88GiB back
          # to runtime buffers, ~7x the 381MB that was missing at the crash.
        - name: MEM_FRACTION_STATIC
          value: "0.75"
        ports:
        - containerPort: 10000
          name: http
        - containerPort: 8998
          name: bootstrap
        - containerPort: 5000
          name: dist-init
        resources:
          # ephemeral-storage was unset before, so the container was unaccounted at
          # scheduling time and was the one kubelet picked to evict under disk
          # pressure. Budget it explicitly: ~24Gi here + 12Gi sidecar sits under the
          # node's ~43Gi allocatable.
          requests:
            google.com/tpu: "4"
            ephemeral-storage: 10Gi
          limits:
            google.com/tpu: "4"
            ephemeral-storage: 24Gi
        volumeMounts:
        - mountPath: /gcs-model
          name: model
          readOnly: true
        - mountPath: /gcs-out
          name: out
        - mountPath: /dev/shm
          name: dev-shm
      volumes:
      - name: dev-shm
        emptyDir:
          medium: Memory
      - name: model
        csi:
          driver: gcsfuse.csi.storage.gke.io
          readOnly: true
          volumeAttributes:
            bucketName: 0-mimo-25
            # file-cache DISABLED (max-size-mb:0). The metadata caches are RAM and
            # stay unbounded, but the file cache is node ephemeral storage: at -1
            # gcsfuse stages each shard to local disk before serving it, which is a
            # 293 GiB write onto a ~43 GiB allocatable disk -> kubelet evicts the pod.
            # It also buys nothing here, since weight load reads each shard exactly
            # once. (enable-parallel-downloads requires the file cache, so it goes too.)
            mountOptions: "implicit-dirs,metadata-cache:ttl-secs:-1,metadata-cache:stat-cache-max-size-mb:-1,metadata-cache:type-cache-max-size-mb:-1,file-cache:max-size-mb:0"
      - name: out
        csi:
          driver: gcsfuse.csi.storage.gke.io
          volumeAttributes:
            bucketName: 0-mimo-25
            mountOptions: "implicit-dirs"
