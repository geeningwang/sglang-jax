# Headless service for rank-0 pod discovery
apiVersion: v1
kind: Service
metadata:
  name: mimo-v25-pro-demo
  namespace: default
spec:
  clusterIP: None
  selector:
    job-name: mimo-v25-pro-demo
  ports:
  - name: dist-init
    port: 6006
  - name: http
    port: 8080
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mimo-v25-pro-demo
  namespace: default
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      subdomain: mimo-v25-pro-demo
      nodeSelector:
        cloud.google.com/gke-nodepool: jingnw-flex-tpu7-8ch
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x2

      tolerations:
      - key: google.com/tpu
        operator: Equal
        value: present
        effect: NoSchedule
      - key: cloud.google.com/gke-queued
        operator: Exists
        effect: NoSchedule
      containers:
      - name: mimo-v25-pro-demo
        image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.8.1-rev1
        imagePullPolicy: IfNotPresent
        command: [bash, -lc]
        args:
        - |
          set -euo pipefail
          export PATH="/opt/venv/bin:${PATH}"
          NODE_RANK=${JOB_COMPLETION_INDEX}
          COORDINATOR="mimo-v25-pro-demo-0.mimo-v25-pro-demo.default.svc.cluster.local"

          echo "=== [rank${NODE_RANK}] Installing sglang-jax ==="
          git clone https://github.com/sgl-project/sglang-jax.git /workspace
          cd /workspace
          uv pip install -e "python[all]"

          echo "=== [rank${NODE_RANK}] Copying weights from GCS ==="
          mkdir -p /dev/shm/mimo-weights
          gsutil -m cp -r gs://jingnw-mimo-v2-5-pro-us-central1/hf-weights/* /dev/shm/mimo-weights/

          echo "=== [rank${NODE_RANK}] Starting MiMo-V2.5-Pro server ==="
          JAX_COMPILATION_CACHE_DIR=gs://jingnw-mimo-v2-5-pro-us-central1/jax-compilation-cache \
          python3 -m sgl_jax.launch_server \
            --model-path /dev/shm/mimo-weights \
            --trust-remote-code \
            --tp-size 16 \
            --device tpu \
            --dtype bfloat16 \
            --mem-fraction-static 0.85 \
            --page-size 128 \
            --chunked-prefill-size 2048 \
            --max-running-requests 8 \
            --skip-server-warmup \
            --host 0.0.0.0 \
            --port 8080 \
            --nnodes 2 \
            --node-rank ${NODE_RANK} \
            --dist-init-addr ${COORDINATOR}:6006 &
          SERVER_PID=$!

          # Only rank 0 runs the demo query; rank 1 is a pure worker
          if [ "${NODE_RANK}" != "0" ]; then
            echo "=== [rank1] Worker node, waiting for server process ==="
            wait $SERVER_PID
            exit $?
          fi

          echo "=== [rank0] Waiting for server to be ready ==="
          for i in $(seq 1 180); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Server is ready after $((i * 5))s"
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "ERROR: Server process died"
              exit 1
            fi
            sleep 5
          done

          echo ""
          echo "=== Demo Inference ==="
          echo "Input: 'What is mixture-of-experts and why is it useful for large language models?'"
          echo ""

          RESPONSE=$(curl -sf http://localhost:8080/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "MiMo-V2.5-Pro",
              "messages": [{"role": "user", "content": "What is mixture-of-experts and why is it useful for large language models?"}],
              "max_tokens": 256,
              "temperature": 0.7
            }')

          echo "Output:"
          echo "$RESPONSE" | python3 -c "
          import sys, json
          resp = json.load(sys.stdin)
          text = resp['choices'][0]['message']['content']
          usage = resp['usage']
          print(text)
          print()
          print(f'[tokens: prompt={usage[\"prompt_tokens\"]}, completion={usage[\"completion_tokens\"]}]')
          "

          echo ""
          echo "=== Demo complete ==="
          kill $SERVER_PID
        env:
        - name: JOB_COMPLETION_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          limits:
            cpu: "220"
            memory: 192Gi
            google.com/tpu: "4"
          requests:
            cpu: "220"
            memory: 192Gi
            google.com/tpu: "4"
