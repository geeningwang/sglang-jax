# PodTemplate used by DWS ProvisioningRequest to estimate resource requirements
apiVersion: v1
kind: PodTemplate
metadata:
  name: mimo-v25-pro-dws-template
  namespace: default
template:
  spec:
    restartPolicy: Never
    nodeSelector:
      cloud.google.com/gke-nodepool: jingnw-dws-tpu7-8ch
      cloud.google.com/gke-tpu-accelerator: tpu7x
      cloud.google.com/gke-tpu-topology: 2x2x2
    tolerations:
    - key: google.com/tpu
      operator: Equal
      value: present
      effect: NoSchedule
    containers:
    - name: mimo-v25-pro-demo
      image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.8.1-rev1
      resources:
        limits:
          cpu: "220"
          memory: 900Gi
          google.com/tpu: "4"
        requests:
          cpu: "220"
          memory: 900Gi
          google.com/tpu: "4"
---
# DWS ProvisioningRequest: provisions 2x2x2 TPU slice for 24 hours.
# Pods must carry the consume-provisioning-request annotation to bind to this capacity.
apiVersion: autoscaling.x-k8s.io/v1
kind: ProvisioningRequest
metadata:
  name: mimo-v25-pro-dws
  namespace: default
spec:
  provisioningClassName: queued-provisioning.gke.io
  parameters:
    maxRunDurationSeconds: "129600"
  podSets:
  - count: 2
    podTemplateRef:
      name: mimo-v25-pro-dws-template
---
# Headless service for rank-0 pod discovery
apiVersion: v1
kind: Service
metadata:
  name: mimo-v25-pro-demo
  namespace: default
spec:
  clusterIP: None
  selector:
    job-name: mimo-v25-pro-demo
  ports:
  - name: dist-init
    port: 6006
  - name: http
    port: 8080
---
# Single indexed job: index 0 = coordinator, index 1 = worker
# completionMode: Indexed ensures gang scheduling on the same 2x2x2 TPU slice.
apiVersion: batch/v1
kind: Job
metadata:
  name: mimo-v25-pro-demo
  namespace: default
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 0
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/consume-provisioning-request: mimo-v25-pro-dws
        cluster-autoscaler.kubernetes.io/provisioning-class-name: queued-provisioning.gke.io
        # Prevent cluster autoscaler from evicting these pods after DWS booking expires.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      restartPolicy: Never
      subdomain: mimo-v25-pro-demo
      nodeSelector:
        cloud.google.com/gke-nodepool: jingnw-dws-tpu7-8ch
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x2
        cloud.google.com/gke-accelerator-count: "4"
      tolerations:
      - key: google.com/tpu
        operator: Equal
        value: present
        effect: NoSchedule
      containers:
      - name: mimo-v25-pro-demo
        image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.8.1-rev1
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        command: [bash, -lc]
        args:
        - |
          set -euo pipefail
          export PATH="/opt/venv/bin:${PATH}"
          INDEX=${JOB_COMPLETION_INDEX}
          COORDINATOR="mimo-v25-pro-demo-0.mimo-v25-pro-demo.default.svc.cluster.local"

          echo "=== [rank${INDEX}] Installing sglang-jax ==="
          git clone https://github.com/sgl-project/sglang-jax.git /workspace
          cd /workspace
          uv pip install -e "python[all]"

          echo "=== [rank${INDEX}] Mounting GCS weights via gcsfuse with RAM file cache ==="
          # gcsfuse file cache avoids re-reading each ep file 414 times from GCS.
          # First access downloads the file (or relevant chunks) to RAM-backed cache.
          # Subsequent reads for the same file come from RAM (~10x faster than GCS FUSE).
          if ! command -v gcsfuse &>/dev/null; then
            export GCSFUSE_REPO=gcsfuse-$(lsb_release -c -s)
            echo "deb [signed-by=/usr/share/keyrings/cloud.google.asc] https://packages.cloud.google.com/apt $GCSFUSE_REPO main" \
              | tee /etc/apt/sources.list.d/gcsfuse.list
            apt-get update -qq && apt-get install -y -qq gcsfuse
          fi
          gcsfuse --version
          mkdir -p /mnt/gcs /mnt/gcsfuse-cache
          # RAM-backed cache: 800 GB max. All 34 safetensors files (~962 GB) won't fully fit,
          # but LRU eviction keeps recently-used ep files hot (most accesses served from RAM).
          gcsfuse \
            --implicit-dirs \
            --file-cache-max-size-mb=800000 \
            --cache-dir=/mnt/gcsfuse-cache \
            jingnw-mimo-v2-5-pro-us-central1 /mnt/gcs
          echo "=== [rank${INDEX}] GCS mount ready: $(ls /mnt/gcs/hf-weights/*.safetensors | wc -l) safetensors files ==="

          ts() { echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')]"; }

          if [ "$INDEX" = "0" ]; then
            echo "$(ts) [rank0] PHASE: launching server"
            JAX_COMPILATION_CACHE_DIR=gs://jingnw-mimo-v2-5-pro-us-central1/jax-compilation-cache \
            python3 -m sgl_jax.launch_server \
              --model-path /mnt/gcs/hf-weights \
              --trust-remote-code \
              --tp-size 16 \
              --device tpu \
              --dtype bfloat16 \
              --mem-fraction-static 0.92 \
              --page-size 16 \
              --chunked-prefill-size 512 \
              --max-running-requests 2 \
              --host 0.0.0.0 \
              --port 8080 \
              --nnodes 2 \
              --node-rank 0 \
              --dist-init-addr ${COORDINATOR}:6006 &
            SERVER_PID=$!
            echo "$(ts) [rank0] PHASE: waiting for /health (server PID=$SERVER_PID)"

            for i in $(seq 1 25920); do
              if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
                echo "$(ts) [rank0] PHASE: server healthy after $((i * 5))s"
                break
              fi
              if ! kill -0 $SERVER_PID 2>/dev/null; then
                echo "$(ts) [rank0] ERROR: server process died after $((i * 5))s"
                exit 1
              fi
              # Heartbeat every 5 min
              if [ $((i % 60)) -eq 0 ]; then
                echo "$(ts) [rank0] still waiting for /health (${i} ticks = $((i * 5))s elapsed)"
              fi
              sleep 5
            done

            echo ""
            echo "$(ts) [rank0] PHASE: sending demo inference request"
            echo "Input: 'What is mixture-of-experts and why is it useful for large language models?'"
            echo ""

            RESPONSE=$(curl -sf --max-time 300 http://localhost:8080/v1/chat/completions \
              -H "Content-Type: application/json" \
              -d '{
                "model": "MiMo-V2.5-Pro",
                "messages": [{"role": "user", "content": "What is mixture-of-experts and why is it useful for large language models?"}],
                "max_tokens": 256,
                "temperature": 0.7
              }')
            echo "$(ts) [rank0] PHASE: inference response received"

            echo "Output:"
            echo "$RESPONSE" | python3 -c "
            import sys, json
            resp = json.load(sys.stdin)
            text = resp['choices'][0]['message']['content']
            usage = resp['usage']
            print(text)
            print()
            print(f'[tokens: prompt={usage[\"prompt_tokens\"]}, completion={usage[\"completion_tokens\"]}]')
            "

            echo ""
            echo "=== Demo complete ==="
            kill $SERVER_PID
          else
            echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] [rank1] PHASE: launching worker server"
            JAX_COMPILATION_CACHE_DIR=gs://jingnw-mimo-v2-5-pro-us-central1/jax-compilation-cache \
            python3 -m sgl_jax.launch_server \
              --model-path /mnt/gcs/hf-weights \
              --trust-remote-code \
              --tp-size 16 \
              --device tpu \
              --dtype bfloat16 \
              --mem-fraction-static 0.92 \
              --page-size 16 \
              --chunked-prefill-size 512 \
              --max-running-requests 2 \
              --host 0.0.0.0 \
              --port 8080 \
              --nnodes 2 \
              --node-rank 1 \
              --dist-init-addr ${COORDINATOR}:6006
          fi
        env:
        - name: JOB_COMPLETION_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        - name: PYTHONUNBUFFERED
          value: "1"
        volumeMounts:
        - name: gcsfuse-cache
          mountPath: /mnt/gcsfuse-cache
        resources:
          limits:
            cpu: "220"
            memory: 900Gi
            google.com/tpu: "4"
          requests:
            cpu: "220"
            memory: 900Gi
            google.com/tpu: "4"
      volumes:
      - name: gcsfuse-cache
        emptyDir:
          medium: Memory
          sizeLimit: 850Gi
