apiVersion: batch/v1
kind: Job
metadata:
  name: count-meta
spec:
  template:
    spec:
      containers:
      - name: main
        image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.9.0-rev1
        command: [bash, -c]
        args:
        - |
          pip3 install -q "orbax-checkpoint>=0.12.0"
          gsutil cp gs://jingnw-mimo-v2-5-pro-us-central1/sglang-checkpoint/95dc2640/tp32_bfloat16/_METADATA /tmp/meta.msgpack
          python3 -c "import msgpack; d = msgpack.unpackb(open('/tmp/meta.msgpack', 'rb').read()); print('Leaves:', len(d['value_metadata_tree']['data']['children']))"
      restartPolicy: Never
