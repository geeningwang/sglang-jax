apiVersion: batch/v1
kind: Job
metadata:
  name: test-tpu-device-put
spec:
  template:
    spec:
      containers:
      - name: main
        image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.9.0-rev1
        command: [bash, -c]
        args:
        - |
          cat << 'PYEOF' > /tmp/test.py
          import jax
          import numpy as np
          import ml_dtypes
          
          arr = np.ones((10, 10), dtype=ml_dtypes.float8_e4m3fn)
          res = jax.device_put(arr, jax.devices()[0])
          print("device_put result type:", type(res))
          PYEOF
          python3 /tmp/test.py
      restartPolicy: Never
