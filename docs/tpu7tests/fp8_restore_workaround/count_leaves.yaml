apiVersion: batch/v1
kind: Job
metadata:
  name: count-leaves
spec:
  template:
    spec:
      containers:
      - name: main
        image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.9.0-rev1
        command: [bash, -c]
        args:
        - |
          gsutil cp gs://jingnw-mimo-v2-5-pro-us-central1/sglang-checkpoint/95dc2640/tp32_bfloat16_abstract_state.pkl /tmp/abs.pkl
          python3 -c "import pickle; import jax; f = open('/tmp/abs.pkl', 'rb'); st = pickle.load(f); flat, _ = jax.tree_util.tree_flatten(st); print('Leaves:', len(flat))"
      restartPolicy: Never
